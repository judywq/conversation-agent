volumes:
  conversation_agent_local_postgres_data: {}
  conversation_agent_local_postgres_data_backups: {}
  conversation_agent_local_redis_data: {}
  conversation_agent_local_miniflux_postgres_data: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: conversation_agent_local_django
    depends_on:
      - postgres
      - redis
      - mailpit
    volumes:
      - .:/app:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.secrets
    ports:
      - '8000:8000'
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: conversation_agent_production_postgres
    volumes:
      - conversation_agent_local_postgres_data:/var/lib/postgresql/data
      - conversation_agent_local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.secrets

  mailpit:
    image: docker.io/axllent/mailpit:latest
    ports:
      - "8025:8025"

  redis:
    image: docker.io/redis:6

    volumes:
      - conversation_agent_local_redis_data:/data

  miniflux-db:
    image: docker.io/postgres:16-alpine
    environment:
      POSTGRES_USER: miniflux
      POSTGRES_PASSWORD: miniflux_local_dev
      POSTGRES_DB: miniflux
    volumes:
      - conversation_agent_local_miniflux_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniflux -d miniflux"]
      interval: 5s
      timeout: 5s
      retries: 10

  miniflux:
    image: docker.io/miniflux/miniflux:2.2.1
    depends_on:
      miniflux-db:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: postgres://miniflux:miniflux_local_dev@miniflux-db:5432/miniflux?sslmode=disable
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: miniflux_local_dev

  celeryworker:
    <<: *django
    image: conversation_agent_local_celeryworker
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: conversation_agent_local_celerybeat
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    image: conversation_agent_local_flower
    ports:
      - '5555:5555'
    command: /start-flower

  vite:
    build:
      context: .
      dockerfile: ./compose/local/vite/Dockerfile
    image: conversation_agent_local_vite
    depends_on:
      - django
    volumes:
      - .:/app:z
      - /app/vue_frontend/node_modules
    command: vite dev --host
    ports:
      - '5173:5173'
