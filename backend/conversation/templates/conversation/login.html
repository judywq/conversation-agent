{% extends "conversation/base.html" %}

{% block title %}Sign in{% endblock %}

{% block content %}
  <div class="card">
    <h1>Sign in</h1>
    <p class="muted">Use your account email and password to set up a discussion topic.</p>
    {% if form.errors %}
      <div class="alert alert-error">Invalid email or password.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="field">
        <label for="id_username">Email</label>
        <input type="email" name="username" autofocus required id="id_username" />
      </div>
      <div class="field">
        <label for="id_password">Password</label>
        <input type="password" name="password" required id="id_password" />
      </div>
      <div class="actions">
        <button type="submit" class="button-primary">Sign in</button>
      </div>
    </form>
  </div>
{% endblock %}
