<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Conversation Agent{% endblock %}</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", system-ui, sans-serif;
        line-height: 1.5;
        --bg: #f4f7fb;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --accent: #2563eb;
        --accent-dark: #1d4ed8;
        --border: #dbe3ef;
        --danger: #b91c1c;
        --success: #047857;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 220px);
        color: var(--text);
      }
      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 2rem 1rem 3rem;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 1.5rem;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
      }
      h1, h2 { margin-top: 0; }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.35rem;
      }
      select, input[type="text"], input[type="email"], input[type="password"], textarea {
        width: 100%;
        padding: 0.75rem 0.85rem;
        border: 1px solid var(--border);
        border-radius: 10px;
        font: inherit;
        background: #fff;
      }
      textarea { min-height: 120px; resize: vertical; }
      .field { margin-bottom: 1rem; }
      .actions {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-top: 1rem;
      }
      button, .button {
        appearance: none;
        border: none;
        border-radius: 999px;
        padding: 0.75rem 1.2rem;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .button-primary, button[type="submit"] {
        background: var(--accent);
        color: #fff;
      }
      .button-primary:hover, button[type="submit"]:hover {
        background: var(--accent-dark);
      }
      .button-secondary {
        background: #e5edf9;
        color: var(--text);
      }
      .muted { color: var(--muted); }
      .alert {
        border-radius: 10px;
        padding: 0.85rem 1rem;
        margin-bottom: 1rem;
      }
      .alert-error { background: #fef2f2; color: var(--danger); }
      .alert-success { background: #ecfdf5; color: var(--success); }
      .scenario-box {
        background: #f8fbff;
        border: 1px dashed var(--border);
        border-radius: 12px;
        padding: 1rem;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
      }
    </style>
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <div class="wrap">
      {% block content %}{% endblock %}
    </div>
  </body>
</html>
