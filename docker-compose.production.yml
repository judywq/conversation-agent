volumes:
  production_postgres_data: {}
  production_postgres_data_backups: {}
  production_traefik: {}
  production_django_media: {}
  production_django_static: {}
  production_redis_data: {}
  production_miniflux_postgres_data: {}


services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
    image: conversation_agent_production_django
    restart: unless-stopped
    volumes:
      - production_django_media:/app/backend/media
      - production_django_static:/app/staticfiles
    depends_on:
      - postgres
      - redis
    env_file:
      - ./.envs/.production/.django
      - ./.envs/.production/.secrets
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: conversation_agent_production_postgres
    restart: unless-stopped
    volumes:
      - production_postgres_data:/var/lib/postgresql/data
      - production_postgres_data_backups:/backups
    env_file:
      - ./.envs/.production/.django
      - ./.envs/.production/.secrets

  traefik:
    build:
      context: .
      dockerfile: ./compose/production/traefik/Dockerfile
    image: conversation_agent_production_traefik
    restart: unless-stopped
    depends_on:
      - django
    volumes:
      - production_traefik:/etc/traefik/acme
    networks:
      - nginxproxymanager_default
      - default
    # ports:
    #   - '80:80'
    #   - '0.0.0.0:443:443'
    #   - '0.0.0.0:5555:5555'

  redis:
    image: docker.io/redis:6
    restart: unless-stopped
    volumes:
      - production_redis_data:/data

  miniflux-db:
    image: docker.io/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: miniflux
      POSTGRES_PASSWORD: miniflux_pw
      POSTGRES_DB: miniflux
    volumes:
      - production_miniflux_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniflux -d miniflux"]
      interval: 5s
      timeout: 5s
      retries: 10

  miniflux:
    image: docker.io/miniflux/miniflux:2.2.1
    restart: unless-stopped
    depends_on:
      miniflux-db:
        condition: service_healthy
    # ports:
    #   - "8081:8080"
    environment:
      DATABASE_URL: postgres://miniflux:miniflux_pw@miniflux-db:5432/miniflux?sslmode=disable
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin_pw

  celeryworker:
    <<: *django
    image: conversation_agent_production_celeryworker
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: conversation_agent_production_celerybeat
    command: /start-celerybeat

  flower:
    <<: *django
    image: conversation_agent_production_flower
    command: /start-flower

  nginx:
    build:
      context: .
      dockerfile: ./compose/production/nginx/Dockerfile
    image: conversation_agent_production_nginx
    restart: unless-stopped
    depends_on:
      - django
    volumes:
      - production_django_media:/usr/share/nginx/media:ro
      - production_django_static:/usr/share/nginx/static:ro

networks:
  nginxproxymanager_default:
    name: nginxproxymanager_default
    external: true
